name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否发布到 GitHub Releases'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release 版本号 Tag (如 v0.1.1)'
        required: false
        type: string
        default: 'v0.1.1'
      is_draft:
        description: '是否保存为草稿 Draft (不直接公开发布)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build frontend & Tauri desktop app
        run: pnpm tauri build

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goods-barcode-studio-windows-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/goods-barcode-studio.exe
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Tag
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "draft=false" >> $GITHUB_OUTPUT
          else
            TAG_NAME="${{ inputs.release_tag }}"
            if [ -z "$TAG_NAME" ]; then
              TAG_NAME="v0.1.0-${{ github.run_number }}"
            fi
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "should_release=${{ inputs.create_release }}" >> $GITHUB_OUTPUT
            echo "draft=${{ inputs.is_draft }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.release_meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: "条码工坊 ${{ steps.release_meta.outputs.tag }}"
          draft: ${{ steps.release_meta.outputs.draft == 'true' }}
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/goods-barcode-studio.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
