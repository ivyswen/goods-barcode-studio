name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      release_draft:
        description: '是否发布为 GitHub Release 草稿 (Draft Release)'
        required: false
        type: boolean
        default: false

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build frontend & Tauri desktop app
        run: pnpm tauri build

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goods-barcode-studio-windows-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/goods-barcode-studio.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release Draft (Optional)
        if: ${{ inputs.release_draft }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          tag_name: v0.1.0-${{ github.run_number }}
          name: "条码工坊 v0.1.0 (Build ${{ github.run_number }})"
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/goods-barcode-studio.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
